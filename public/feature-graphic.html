<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
.wrap{width:1024px;height:500px;position:relative;background:#08080F;font-family:'Poppins',sans-serif;overflow:hidden}
/* two-world split hero */
.hero{position:absolute;inset:0;display:flex}
.half{flex:1;background-size:cover;background-position:center top;filter:saturate(1.05)}
.left{background-image:url('/generated/cricket-posts/cr-s25-pass.png')}
.right{background-image:url('/generated/creator-house-posts/scene-terrace-night.png');background-position:center}
/* dark scrims for legibility */
.scrim{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 90% at 50% 50%, rgba(8,8,15,.55) 0%, rgba(8,8,15,.82) 55%, rgba(8,8,15,.96) 100%),
  linear-gradient(180deg, rgba(8,8,15,.35) 0%, transparent 22%, transparent 72%, rgba(8,8,15,.7) 100%)}
.seam{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);
  background:linear-gradient(180deg, transparent, rgba(255,45,120,.55), transparent)}
/* content */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.eyebrow{font-size:15px;font-weight:800;letter-spacing:.42em;color:#FFB020;text-transform:uppercase;margin-bottom:14px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.word{font-family:'Fraunces',serif;font-weight:700;font-size:150px;line-height:.9;color:#fff;letter-spacing:-.01em;
  text-shadow:0 6px 40px rgba(0,0,0,.85), 0 0 60px rgba(255,45,120,.25)}
.tag{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:30px;color:rgba(255,255,255,.94);margin-top:12px;text-shadow:0 2px 20px rgba(0,0,0,.9)}
.worlds{display:flex;gap:26px;margin-top:26px}
.chip{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:9px 20px;backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(0,0,0,.4)}
.chip b{font-weight:700}
.glowline{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#003087,#FF2D78 55%,#FFB020)}
</style></head>
<body><div class="wrap">
  <div class="hero"><div class="half left"></div><div class="half right"></div></div>
  <div class="scrim"></div>
  <div class="seam"></div>
  <div class="center">
    <div class="eyebrow">Interactive Stories</div>
    <div class="word">LORE</div>
    <div class="tag">Live inside the story.</div>
    <div class="worlds">
      <div class="chip">🏏 <b>Indian Dressing Room</b></div>
      <div class="chip">🏠 <b>Creator House</b></div>
    </div>
  </div>
  <div class="glowline"></div>
</div></body></html>
