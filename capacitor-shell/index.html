<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lore</title>
  <style>
    /* Self-contained Lore loading splash — shown by the native shell before/if the
       live site loads. No external assets (works offline). Mirrors LoadingScreen.tsx. */
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#08080F;color:#fff;overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .wash{position:absolute;inset:0;background:radial-gradient(120% 85% at 50% 40%,rgba(255,45,120,.16),transparent 62%)}
    .markwrap{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:24px}
    .halo{position:absolute;width:96px;height:96px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,45,120,.45),transparent 70%);filter:blur(10px);
      animation:halo 2.6s ease-in-out infinite}
    svg{position:relative;filter:drop-shadow(0 0 18px rgba(255,45,120,.55))}
    .ring{transform-origin:16px 16px;animation:spin 2.6s linear infinite}
    .inner{transform-origin:16px 16px;animation:cspin 3.4s linear infinite}
    .core{transform-origin:16px 16px;animation:halo 1.6s ease-in-out infinite}
    .word{position:relative;font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;font-size:34px;letter-spacing:.5px;line-height:1}
    .tag{position:relative;font-size:13.5px;color:#a8a8b3;margin-top:8px;letter-spacing:.3px}
    .track{position:relative;margin-top:30px;width:150px;height:3px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
    .bar{position:absolute;top:0;bottom:0;width:42%;border-radius:99px;background:#FF2D78;animation:bar 1.25s cubic-bezier(.4,0,.2,1) infinite}
    .status{position:relative;margin-top:14px;font-size:12px;color:#5e5e6e;letter-spacing:.04em}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cspin{to{transform:rotate(-360deg)}}
    @keyframes halo{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes bar{0%{left:-42%}100%{left:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wash"></div>
    <div class="markwrap">
      <div class="halo"></div>
      <svg viewBox="0 0 32 32" fill="none" width="64" height="64">
        <defs>
          <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff2d78" />
            <stop offset=".55" stop-color="#ff8a3d" />
            <stop offset="1" stop-color="#ffd24d" />
          </linearGradient>
        </defs>
        <circle class="ring" cx="16" cy="16" r="13.5" stroke="url(#m)" stroke-width="3" stroke-dasharray="58 12" stroke-linecap="round" />
        <circle class="inner" cx="16" cy="16" r="6.4" stroke="#ff2d78" stroke-width="2.4" />
        <circle class="core" cx="16" cy="16" r="1.9" fill="#ffd24d" />
      </svg>
    </div>
    <div class="word">Lore</div>
    <div class="tag">Live your story</div>
    <div class="track"><span class="bar"></span></div>
    <div class="status">Setting the scene</div>
  </div>
</body>
</html>
